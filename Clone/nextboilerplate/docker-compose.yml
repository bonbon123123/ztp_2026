# Serwery pomocnicze: testowanie powiadomień + monitoring (Postgres działa w osobnym kontenerze postgres_ztp_project1)
services:
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog_ztp
    restart: unless-stopped
    ports:
      - "8025:8025" # UI
      - "1025:1025" # SMTP

  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy_ztp
    command: serve
    restart: unless-stopped
    ports:
      - "8088:80"

  # monitoring — odczytuje /metrics aplikacji co 5 s, UI: http://localhost:9090
  prometheus:
    image: prom/prometheus
    container_name: prometheus_ztp
    restart: unless-stopped
    volumes:
      - ./.config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # sieć hosta: Prometheus widzi aplikację pod localhost:3000, a UI jest pod localhost:9090.
    # (host.docker.internal + extra_hosts blokuje na tym komputerze firewall ufw)
    network_mode: host
